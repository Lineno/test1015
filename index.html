<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎙️ 聲控解謎成語遊戲</title>

    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 成語專用字體：帶有書法感的字體，增加語文學習氛圍 */
        .idiom-text {
            font-family: 'Ma Shan Zheng', 'Noto Serif TC', serif;
        }

        /* 發光補齊動畫 */
        @keyframes popGlow {
            0% { transform: scale(0.8); opacity: 0.5; box-shadow: 0 0 0 rgba(34, 197, 94, 0); }
            50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 20px rgba(34, 197, 94, 0.8); }
            100% { transform: scale(1); opacity: 1; box-shadow: 0 0 10px rgba(34, 197, 94, 0.5); }
        }
        .animate-pop-glow {
            animation: popGlow 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* 麥克風錄音時的脈衝動畫 */
        @keyframes pulseRing {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .is-listening {
            animation: pulseRing 1.5s infinite;
            background-color: #ef4444 !important; /* Tailwind red-500 */
            color: white !important;
        }

        /* 錯誤搖晃動畫 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        .animate-shake {
            animation: shake 0.5s ease-in-out;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center py-10 px-4 sm:px-8">

    <div class="max-w-4xl w-full bg-white rounded-[2.5rem] shadow-2xl border-8 border-indigo-200 overflow-hidden relative">
        
        <!-- 頂部裝飾條 -->
        <div class="h-4 bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 w-full"></div>

        <div class="p-6 sm:p-10 flex flex-col items-center gap-8">
            
            <!-- 網頁標題 -->
            <div class="text-center">
                <h1 class="text-4xl sm:text-5xl font-black text-indigo-700 mb-2 drop-shadow-sm flex items-center justify-center gap-3">
                    <span>🎙️</span> 聲控解謎成語遊戲 <span>🧩</span>
                </h1>
                <p class="text-lg sm:text-xl text-gray-600 font-bold mt-4">
                    聽老師唸一遍，然後按下麥克風大聲唸出<span class="text-indigo-600">「完整的成語」</span>來解開謎題！
                </p>
                <!-- 進度顯示 -->
                <div class="mt-4 inline-block bg-indigo-100 text-indigo-800 px-4 py-1 rounded-full font-bold text-sm tracking-widest">
                    第 <span id="currentLevelDisplay">1</span> / <span id="totalLevelDisplay">5</span> 關
                </div>
            </div>

            <div class="w-full bg-indigo-50 rounded-3xl p-8 border-[4px] border-dashed border-indigo-200 relative flex flex-col items-center">
                
                <!-- 成語字塊顯示區 -->
                <div id="idiomContainer" class="flex gap-2 sm:gap-4 mb-6">
                    <!-- 字塊將由 JS 動態生成 -->
                </div>

                <!-- 釋義提示 -->
                <div class="bg-white px-6 py-4 rounded-2xl shadow-sm border-2 border-indigo-100 text-center max-w-2xl w-full">
                    <span class="text-indigo-400 font-bold mr-2">💡 提示：</span>
                    <span id="idiomMeaning" class="text-gray-700 text-lg sm:text-xl font-bold"></span>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-6 w-full justify-center mt-2">
                
                <!-- 聽老師唸 (TTS) -->
                <button id="btnTTS" class="flex-1 max-w-xs bg-gradient-to-b from-amber-300 to-amber-500 hover:from-amber-400 hover:to-amber-600 text-white font-bold text-2xl py-4 px-6 rounded-2xl shadow-[0_6px_0_#b45309] active:shadow-none active:translate-y-2 transition-all flex items-center justify-center gap-3">
                    <span class="text-3xl">🔊</span> 
                    <span id="ttsText">聽老師唸</span>
                </button>

                <!-- 換你唸 (STT) -->
                <button id="btnMic" class="flex-1 max-w-xs bg-gradient-to-b from-emerald-400 to-emerald-600 hover:from-emerald-500 hover:to-emerald-700 text-white font-bold text-2xl py-4 px-6 rounded-2xl shadow-[0_6px_0_#047857] active:shadow-none active:translate-y-2 transition-all flex items-center justify-center gap-3">
                    <span class="text-3xl">🎤</span> 
                    <span id="micText">換你唸</span>
                </button>

            </div>

            <!-- 狀態與辨識結果顯示區 -->
            <div class="min-h-[60px] flex flex-col items-center justify-center">
                <p id="statusMessage" class="text-xl font-bold text-gray-500 transition-colors duration-300">
                    等待開始...
                </p>
                <p id="recognizedText" class="text-lg text-gray-400 mt-1 italic hidden"></p>
            </div>

            <!-- 下一關按鈕 (隱藏，過關時顯示) -->
            <button id="btnNext" class="hidden bg-gradient-to-r from-blue-500 to-cyan-500 hover:from-blue-600 hover:to-cyan-600 text-white font-bold text-2xl py-3 px-10 rounded-full shadow-lg transition-transform hover:scale-105 active:scale-95 animate-bounce">
                🎉 太棒了！前往下一關 ➡️
            </button>

        </div>
    </div>

    <!-- 自訂訊息彈窗 (取代 alert) -->
    <div id="customModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center transform transition-transform scale-90">
            <div id="modalIcon" class="text-5xl mb-4">⚠️</div>
            <h2 id="modalTitle" class="text-2xl font-black text-gray-800 mb-2">提示</h2>
            <p id="modalMessage" class="text-gray-600 font-bold mb-6 text-lg"></p>
            <button id="modalClose" class="bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-2 px-8 rounded-full shadow-md w-full">知道了</button>
        </div>
    </div>

    <script>
        // 國小中高年級常用成語題庫
        const idiomsData = [
            { full: "守株待兔", chars: ["守", "株", "待", "兔"], missingIndex: 3, meaning: "比喻妄想不勞而獲，或死守狹隘的經驗，不知變通。" },
            { full: "井底之蛙", chars: ["井", "底", "之", "蛙"], missingIndex: 3, meaning: "比喻見識淺薄、眼界狹窄的人。" },
            { full: "畫蛇添足", chars: ["畫", "蛇", "添", "足"], missingIndex: 3, meaning: "比喻多此一舉，不但無益，反而有害。" },
            { full: "半途而廢", chars: ["半", "途", "而", "廢"], missingIndex: 3, meaning: "比喻事情沒有做完就停止，不能堅持到底。" },
            { full: "亡羊補牢", chars: ["亡", "羊", "補", "牢"], missingIndex: 3, meaning: "比喻犯錯後及時更正，還能補救，為時未晚。" },
            { full: "對牛彈琴", chars: ["對", "牛", "彈", "琴"], missingIndex: 3, meaning: "比喻對不懂道理的人講道理，白費口舌。" },
            { full: "拔苗助長", chars: ["拔", "苗", "助", "長"], missingIndex: 3, meaning: "比喻不顧事物發展規律，強求速成，反而把事情弄糟。" },
            { full: "狐假虎威", chars: ["狐", "假", "虎", "威"], missingIndex: 3, meaning: "比喻藉著別人的權勢來欺壓或嚇唬他人。" }
        ];

        // 遊戲狀態變數
        let currentLevelIndex = 0;
        let isListening = false;
        let isLevelCompleted = false;

        // DOM 元素選取
        const idiomContainer = document.getElementById('idiomContainer');
        const idiomMeaning = document.getElementById('idiomMeaning');
        const currentLevelDisplay = document.getElementById('currentLevelDisplay');
        const totalLevelDisplay = document.getElementById('totalLevelDisplay');
        
        const btnTTS = document.getElementById('btnTTS');
        const ttsText = document.getElementById('ttsText');
        const btnMic = document.getElementById('btnMic');
        const micText = document.getElementById('micText');
        const btnNext = document.getElementById('btnNext');
        
        const statusMessage = document.getElementById('statusMessage');
        const recognizedTextDisplay = document.getElementById('recognizedText');

        // 自訂 Modal 元素
        const customModal = document.getElementById('customModal');
        const modalIcon = document.getElementById('modalIcon');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modalClose = document.getElementById('modalClose');

        // 1. 初始化 Web Speech API (語音合成)
        const synth = window.speechSynthesis;
        let voices = [];
        
        // 確保載入語音包
        function loadVoices() {
            voices = synth.getVoices();
        }
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }

        // 2. 初始化 Web Speech API (語音辨識)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'zh-TW';
            recognition.continuous = false; // 唸完一次就停止
            recognition.interimResults = false; // 只取最終結果
            
            // 辨識開始事件
            recognition.onstart = function() {
                isListening = true;
                btnMic.classList.add('is-listening');
                micText.innerText = '聆聽中...';
                updateStatus('請對著麥克風大聲唸出完整的成語喔！', 'text-blue-600');
                recognizedTextDisplay.classList.add('hidden');
                
                // 若正在播放語音，則強制停止，避免麥克風收到電腦自己的聲音
                synth.cancel();
            };

            // 辨識結果事件
            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                checkAnswer(transcript);
            };

            // 辨識結束事件
            recognition.onend = function() {
                isListening = false;
                btnMic.classList.remove('is-listening');
                if (!isLevelCompleted) {
                    micText.innerText = '換你唸';
                    // 如果沒有成功，提示再試一次 (狀態文字可能在 checkAnswer 中被覆蓋，這裡做防呆)
                    if (statusMessage.innerText === '請對著麥克風大聲唸出完整的成語喔！') {
                        updateStatus('沒有聽清楚，請再試一次！', 'text-amber-500');
                    }
                }
            };

            // 辨識錯誤事件
            recognition.onerror = function(event) {
                isListening = false;
                btnMic.classList.remove('is-listening');
                micText.innerText = '換你唸';
                
                if (event.error === 'not-allowed') {
                    showModal('🎤 麥克風未授權', '請允許網頁使用麥克風，才能進行聲控遊戲喔！');
                    updateStatus('麥克風未授權', 'text-red-500');
                } else if (event.error === 'no-speech') {
                    updateStatus('沒有聽到聲音，請再按一次按鈕試試看。', 'text-amber-500');
                } else {
                    updateStatus(`發生錯誤: ${event.error}`, 'text-red-500');
                }
            };
        } else {
            // 不支援語音辨識的處理
            showModal('😢 瀏覽器不支援', '您的瀏覽器不支援語音辨識功能。建議使用最新版的 Google Chrome 以獲得最佳體驗。');
            btnMic.disabled = true;
            btnMic.classList.add('opacity-50', 'cursor-not-allowed');
        }

        // 載入關卡
        function loadLevel(index) {
            isLevelCompleted = false;
            const idiom = idiomsData[index];
            
            // 更新進度與提示
            currentLevelDisplay.innerText = index + 1;
            totalLevelDisplay.innerText = idiomsData.length;
            idiomMeaning.innerText = idiom.meaning;
            
            // 重置狀態
            updateStatus('點擊上方按鈕聽老師唸，或直接挑戰！', 'text-gray-500');
            recognizedTextDisplay.classList.add('hidden');
            btnNext.classList.add('hidden');
            btnMic.classList.remove('hidden');
            micText.innerText = '換你唸';
            
            // 生成成語字塊
            idiomContainer.innerHTML = '';
            idiom.chars.forEach((char, i) => {
                const charBox = document.createElement('div');
                
                if (i === idiom.missingIndex) {
                    // 遺漏的字塊 (挖空)
                    charBox.id = 'missingBox';
                    charBox.className = 'w-16 h-20 sm:w-24 sm:h-28 border-4 border-dashed border-gray-400 rounded-2xl flex items-center justify-center idiom-text text-4xl sm:text-6xl text-transparent bg-gray-100 transition-all duration-500 shadow-inner';
                    charBox.innerText = char; // 文字先藏在裡面，用 text-transparent 隱藏
                } else {
                    // 顯示的字塊
                    charBox.className = 'w-16 h-20 sm:w-24 sm:h-28 border-4 border-indigo-400 rounded-2xl flex items-center justify-center idiom-text text-4xl sm:text-6xl text-indigo-800 bg-white shadow-md';
                    charBox.innerText = char;
                }
                
                idiomContainer.appendChild(charBox);
            });
        }

        // 播放語音 (TTS 楷模示範)
        function playModelingSpeech() {
            if (isListening) {
                showModal('💡 提示', '正在聽你說話喔，請先講完或等麥克風停止。');
                return;
            }

            synth.cancel(); // 停止先前的語音
            const idiom = idiomsData[currentLevelIndex];
            const utterance = new SpeechSynthesisUtterance(idiom.full);
            
            // 針對學童的設計細節：微調語速與音高
            utterance.lang = 'zh-TW';
            utterance.rate = 0.85; // 放慢語速，讓發音更清晰
            utterance.pitch = 1.1; // 提高音高，聲音較親切

            const twVoice = voices.find(v => v.lang.includes('zh-TW') || v.lang.includes('zh_TW'));
            if (twVoice) utterance.voice = twVoice;

            utterance.onstart = () => {
                btnTTS.classList.add('opacity-80', 'scale-95');
                ttsText.innerText = '老師唸讀中...';
            };

            utterance.onend = () => {
                btnTTS.classList.remove('opacity-80', 'scale-95');
                ttsText.innerText = '聽老師唸';
            };

            synth.speak(utterance);
        }

        // 檢查使用者語音輸入
        function checkAnswer(transcript) {
            const idiom = idiomsData[currentLevelIndex];
            // 移除標點符號，方便比對
            const cleanTranscript = transcript.replace(/[。，！？.,!?]/g, '');
            
            // 顯示辨識到的文字
            recognizedTextDisplay.innerText = `你說了：「${cleanTranscript}」`;
            recognizedTextDisplay.classList.remove('hidden');

            // 判斷邏輯：確保學童「唸出完整的成語」
            if (cleanTranscript.includes(idiom.full)) {
                triggerWin();
            } else {
                triggerFail();
            }
        }

        // 過關動畫與邏輯
        function triggerWin() {
            isLevelCompleted = true;
            updateStatus('🎉 答對了！發音很標準喔！', 'text-green-600');
            
            // 隱藏麥克風按鈕，顯示下一關按鈕
            btnMic.classList.add('hidden');
            
            if (currentLevelIndex < idiomsData.length - 1) {
                btnNext.classList.remove('hidden');
                btnNext.innerText = '🎉 太棒了！前往下一關 ➡️';
            } else {
                btnNext.classList.remove('hidden');
                btnNext.innerText = '🏆 恭喜完成所有挑戰！重新開始';
            }

            // 字塊發光補齊動畫
            const missingBox = document.getElementById('missingBox');
            if (missingBox) {
                // 移除虛線與透明樣式，加入實體與發光動畫樣式
                missingBox.className = 'w-16 h-20 sm:w-24 sm:h-28 border-4 border-green-500 rounded-2xl flex items-center justify-center idiom-text text-4xl sm:text-6xl text-green-700 bg-green-50 animate-pop-glow';
            }
        }

        // 失敗回饋
        function triggerFail() {
            updateStatus('🤔 好像不太對喔，再試著唸一次完整的成語！', 'text-amber-500');
            
            const missingBox = document.getElementById('missingBox');
            if (missingBox) {
                // 觸發搖晃動畫
                missingBox.classList.remove('animate-shake');
                void missingBox.offsetWidth; // 觸發 reflow 讓動畫可以重播
                missingBox.classList.add('animate-shake');
                missingBox.classList.add('border-red-400', 'bg-red-50');
                
                setTimeout(() => {
                    missingBox.classList.remove('border-red-400', 'bg-red-50');
                }, 500);
            }
        }

        // 更新狀態文字助手函數
        function updateStatus(text, colorClass) {
            statusMessage.innerText = text;
            statusMessage.className = `text-xl font-bold transition-colors duration-300 ${colorClass}`;
        }

        // 綁定按鈕事件
        btnTTS.addEventListener('click', playModelingSpeech);
        
        btnMic.addEventListener('click', () => {
            if (isListening) {
                recognition.stop();
            } else {
                if (recognition) {
                    try {
                        recognition.start();
                    } catch (e) {
                        // 防止連續點擊造成的 DOMException
                        console.log("Recognition already started.");
                    }
                }
            }
        });

        btnNext.addEventListener('click', () => {
            currentLevelIndex++;
            if (currentLevelIndex >= idiomsData.length) {
                // 遊戲全破，重新開始
                currentLevelIndex = 0;
                showModal('🏆 遊戲通關', '太厲害了！你已經完成了所有成語挑戰，發音都非常標準！');
            }
            loadLevel(currentLevelIndex);
        });

        // Modal 控制邏輯
        function showModal(title, message) {
            modalTitle.innerText = title;
            modalMessage.innerText = message;
            customModal.classList.remove('hidden');
            customModal.classList.add('flex');
            // 彈出動畫
            const modalBox = customModal.querySelector('div');
            setTimeout(() => modalBox.classList.replace('scale-90', 'scale-100'), 10);
        }

        modalClose.addEventListener('click', () => {
            const modalBox = customModal.querySelector('div');
            modalBox.classList.replace('scale-100', 'scale-90');
            setTimeout(() => {
                customModal.classList.add('hidden');
                customModal.classList.remove('flex');
            }, 200);
        });

        // 初始載入第一關
        document.addEventListener('DOMContentLoaded', () => {
            // 隨機打亂題庫順序 (可選，這裡保持固定順序以便展示)
            // idiomsData.sort(() => Math.random() - 0.5);
            loadLevel(0);
        });

    </script>
</body>
</html>
